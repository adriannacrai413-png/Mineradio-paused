<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c121b"/><stop offset=".55" stop-color="#214348"/><stop offset="1" stop-color="#201322"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263e42" stop-opacity=".88"/><stop offset="1" stop-color="#0a141a" stop-opacity=".9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="72" y="72" fill="#eafffb" font-size="26" font-family="Microsoft YaHei, sans-serif" font-weight="700">桌面歌单小窗 · 状态草图</text>
  <text x="72" y="104" fill="#8eb3ad" font-size="14" font-family="Microsoft YaHei, sans-serif">锁定、穿透、空状态和同步失败都在同一套窗口框架里呈现</text>
  <g transform="translate(72 150)" filter="url(#shadow)">
